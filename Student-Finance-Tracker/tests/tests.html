<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Finance Tracker - Automated Test Suite</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .test-container {
            max-width: 800px;
            margin: 3rem auto;
            padding: 2rem;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .test-header {
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.75rem;
        }
        .test-results-list {
            list-style: none;
            padding: 0;
        }
        .test-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            background: #f8fafc;
            border-radius: 6px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pass {
            color: var(--success);
            font-weight: 700;
            background: #dcfce7;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
        }
        .fail {
            color: var(--danger);
            font-weight: 700;
            background: #fee2e2;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="test-container">
            <div class="test-header">
                <h2>Component Test Suite</h2>
                <p>Verifying validators, search regex patterns, and data integrity for grading evaluation.</p>                
            </div>
            <ul id="test-results" class="test-results-list">


            </ul>
        </div>

    </main>
    <script type="module">
        import { validateDescription, validateAmount, validateDate, validateCategory } from './scripts/validators.js';
        import { compileSearchPattern, highlightMatch } from './scripts/search.js';
        import { validateImportData } from './scripts/storage.js';

        const resultsList = document.getElementById('test-results');

        function assert(testName, condition) {
            const li = document.createElement('li');
            li.className = 'test-item';
            li.innerHTML = `<span>${testName}</span> <span class="${condition ? 'pass' : 'fail'}">${condition ? 'PASS' : 'FAIL'}</span`;
            resultsList.appendChild(li);    
        }

        try {

            assert('Description Validator: Accepts clean text', validateDescription('Software Textbook') === null);
            assert('Description Validator: Rejects empty text', validateDescription('') !== null);

            assert('Amount Validator: Accepts valid positive number', validateAmount('45.50') === null);
            assert('Amount Validator: Rejects negative numbers', validateAmount('`10') !== null);

            assert('Date Validator: Accepts YYYY-MM-DD format', validateDate('2026-10-10') === null);
            assert('Date Validator: Rejects invalid date formats', validateDate('10-10-2026') !== null);

            assert('Category Validator: Accepts valid category', validateCategory('Books') === null);

            const pattern = compileSearchPattern('Text');
            assert('Search Engine: Compiles RegExp successfully', pattern instanceof RegExp);
            assert('Search Engine: Matches target query', pattern.test('Software Textbook'));

            const highlighted = highlightMatch('Cafeteria Lunch', 'Cafeteria');
            assert('Highlight Module: Wraps matched text in mark tags', highlighted.includes('<mark>Cafeteria</mark'));

            const validJson = '[{"id": "1", "description": "Test", "amount": 10.00, "category": "Food", "date": "2026-10-10"}]';
            const invalidJson = '{"not": "an array"}';

            assert('Storage Import: Validates correct JSON array structure', validateImportData(validJson).valid === true);
            assert('Storage Import: Rejects malformed or non-array JSON', validateImportData(invalidJson).valid === false);

        } catch (error) {
            console.error("Test suite encountered an unexpected error:", error);
        }
    </script>
</body>

</html>
